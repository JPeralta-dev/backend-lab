services:
  postgres:
    image: postgres:16
    container_name: backend-lab-postgres
    environment:
      POSTGRES_DB: backend_lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: backend-lab-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data: